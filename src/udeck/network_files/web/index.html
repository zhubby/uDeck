<!doctype html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Files · uDeck</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="uDeck Files"><img src="/assets/logo.svg" alt="" width="44" height="44"><span>uDeck</span><span class="brand-divider"></span><span class="brand-section" data-i18n="Files">Files</span></a>
    <span id="connection" class="connection"><i></i><span data-i18n="Connected to your device">Connected to your device</span></span>
  </header>
  <main>
    <section class="workspace-heading" aria-labelledby="heading">
      <div><p class="eyebrow" data-i18n="NETWORK ACCESS">NETWORK ACCESS</p><h1 id="heading" data-i18n="Files">Files</h1><p class="workspace-subtitle" id="subtitle"></p></div>
      <div class="main-actions"><div class="upload-control"><button id="upload-button" class="primary" data-i18n="Upload files">Upload files</button><button id="upload-folder" class="folder-upload" data-i18n="Upload folder">Upload folder</button></div><button id="new-folder" data-i18n="New folder">New folder</button></div>
    </section>
    <div class="toolbar">
      <nav id="breadcrumbs" aria-label="Folder path"></nav>
      <div class="view-tools"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="search" type="search" placeholder="Search this folder" data-placeholder="Search this folder" aria-label="Search this folder"></label><button class="icon-button" id="view-toggle" title="List view" aria-label="List view"></button><button class="icon-button" id="options-toggle" aria-label="View options" title="View options"></button></div>
    </div>
    <div class="view-options" id="view-options" hidden><label><span data-i18n="Sort">Sort</span><select id="sort"><option value="name" data-i18n="Name">Name</option><option value="modified" data-i18n="Modified">Modified</option><option value="size" data-i18n="Size">Size</option></select></label><label><input id="descending" type="checkbox"><span data-i18n="Reverse order">Reverse order</span></label><label><input id="hidden" type="checkbox"><span data-i18n="Show hidden files">Show hidden files</span></label></div>
    <div id="selection" class="selection-bar" hidden><button id="clear-selection" class="icon-button" aria-label="Clear selection">×</button><strong id="selection-count"></strong><div class="selection-actions"><button id="download" data-i18n="Download">Download</button><button id="copy" data-i18n="Copy">Copy</button><button id="move" data-i18n="Move">Move</button><button id="rename" data-i18n="Rename">Rename</button><button id="trash" class="danger" data-i18n="Move to Trash">Move to Trash</button></div></div>
    <div class="list-heading" id="list-heading" hidden><span data-i18n="Name">Name</span><span data-i18n="Size">Size</span><span data-i18n="Modified">Modified</span></div>
    <section id="files" class="files-grid" aria-label="Files"></section>
    <p id="loading" class="loading" role="status" hidden data-i18n="Loading…">Loading…</p>
    <div id="empty" class="empty" hidden><img src="/assets/icon/folder" alt="" width="64" height="64"><h2 data-i18n="This folder is empty">This folder is empty</h2><p data-i18n="Drop files here, or choose Upload files.">Drop files here, or choose Upload files.</p></div>
    <div id="load-error" class="load-error" hidden><p id="load-error-message"></p><button id="retry" data-i18n="Try again">Try again</button></div>
    <button id="load-more" class="load-more" hidden data-i18n="Load more">Load more</button>
    <footer class="workspace-footer"><div><span id="item-count"></span><span class="footer-separator">·</span><button id="select-all" data-i18n="Select all">Select all</button></div><span id="space"></span></footer>
  </main>
  <aside class="transfers" id="transfers" hidden><button id="transfers-toggle" class="transfers-heading"><span data-i18n="Transfers & tasks">Transfers & tasks</span><span id="transfer-count"></span><span id="transfer-arrow">⌄</span></button><div id="transfer-items"></div></aside>
  <div class="drop-overlay" id="drop-overlay" hidden><div><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 34V8m-9 9 9-9 9 9M8 31v10h32V31"></path></svg><h2 data-i18n="Drop into this folder">Drop into this folder</h2><p id="drop-destination"></p></div></div>
  <div id="toast" role="status" hidden></div>
  <dialog id="dialog"><form id="dialog-form"><button type="button" id="dialog-close" class="dialog-close" aria-label="Close">×</button><h2 id="dialog-title"></h2><p id="dialog-body"></p><div id="dialog-content"></div><div class="dialog-actions" id="dialog-actions"></div></form></dialog>
  <input id="file-input" type="file" multiple hidden>
  <input id="folder-input" type="file" multiple webkitdirectory hidden>
</body>
</html>
