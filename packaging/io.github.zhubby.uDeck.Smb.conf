<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.zhubby.uDeck.Smb"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.zhubby.uDeck.Smb" send_interface="io.github.zhubby.uDeck.Smb" send_member="Status"/>
    <allow send_destination="io.github.zhubby.uDeck.Smb" send_interface="io.github.zhubby.uDeck.Smb" send_member="Configure"/>
    <allow send_destination="io.github.zhubby.uDeck.Smb" send_interface="io.github.zhubby.uDeck.Smb" send_member="Stop"/>
    <allow send_destination="io.github.zhubby.uDeck.Smb" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.zhubby.uDeck.Smb" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
