name: Release Debian packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify CM4 arm64 suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the published tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check release version
        run: python3 tools/build-release --tag "$RELEASE_TAG" --check-version
      - name: Prepare Debian 13 builder
        run: docker build -f tools/debian-build.Dockerfile -t udeck-debian-builder .
      - name: Build packages and matching source
        run: |
          docker run --rm \
            -e DEB_BUILD_OPTIONS=parallel=2 \
            -v "$GITHUB_WORKSPACE:/workspace" udeck-debian-builder \
            python3 tools/build-release --tag "$RELEASE_TAG" --output dist/release
      - name: Prepare clean installation environment
        run: docker build -f tools/debian-test.Dockerfile -t udeck-debian-test .
      - name: Verify install, upgrade, remove and reinstall
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" \
            udeck-debian-test python3 /workspace/tests/debian_package_probe.py /workspace/dist/release
      - name: Keep verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: udeck-arm64-release
          path: dist/release/*
          if-no-files-found: error
      - name: Attach packages and source to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
