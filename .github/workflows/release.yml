# [INPUT]: 依赖已发布 Release、匹配标签和 runner 预建的制品目录。
# [OUTPUT]: 验证 arm64 deb，保存版本化 Actions 制品并附加 Release 附件。
# [POS]: 唯一发布工作流；仅 release: published 触发。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
name: Release uDeck Debian package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify CM4 arm64 suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the published tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check release version
        id: version
        run: |
          version="$(python3 tools/build-release --tag "$RELEASE_TAG" --check-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
            src/udeck/__init__.py
      - name: Verify development dependencies and lint
        run: |
          uv python install
          uv lock --check
          uv sync --locked --extra dev
          uv run --locked --extra dev ruff check src tests tools tools/build-release tools/test-suite
      - name: Prepare Debian 13 builder
        run: docker build -f tools/debian-build.Dockerfile -t udeck-debian-builder .
      - name: Build the package and matching source
        run: |
          mkdir -p dist/release dist/previous
          docker run --rm \
            -e DEB_BUILD_OPTIONS=parallel=2 \
            -v "$GITHUB_WORKSPACE:/workspace" udeck-debian-builder \
            python3 tools/build-release --tag "$RELEASE_TAG" --output dist/release
      - name: Prepare clean installation environment
        run: docker build -f tools/debian-test.Dockerfile -t udeck-debian-test .
      - name: Find previous published release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/udeck-releases.json"
          previous_tag="$(python3 tools/build-release --previous-release-from "$RUNNER_TEMP/udeck-releases.json")"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Download previous release package
        if: steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          mkdir -p dist/previous
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "udeck_${PREVIOUS_TAG#v}_arm64.deb" --pattern SHA256SUMS --dir dist/previous
          (cd dist/previous && sha256sum --check --ignore-missing SHA256SUMS)
      - name: Verify install, upgrade, rollback and configuration preservation
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          arguments=()
          if [ -n "$PREVIOUS_TAG" ]; then
            previous_package="dist/previous/udeck_${PREVIOUS_TAG#v}_arm64.deb"
            test -f "$previous_package"
            arguments=(--previous "/workspace/$previous_package")
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" \
            udeck-debian-test python3 /workspace/tests/debian_package_probe.py \
              /workspace/dist/release "${arguments[@]}"
      - name: Keep verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: udeck-${{ steps.version.outputs.version }}-arm64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Attach the package and source to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
