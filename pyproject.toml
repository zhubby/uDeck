[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udeck"
version = "0.1.20"
description = "A button-first desktop shell for ClockworkPi uConsole"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<6.9",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
  "evdev>=1.9; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "dbus-next>=0.2.3"]

[project.scripts]
udeck = "udeck.main:main"
udeckctl = "udeck.cli:main"
udeck-terminal = "udeck.terminal.main:main"
udeck-terminal-default = "udeck.terminal.defaults:main"
udeck-app = "udeck.apps.main:main"
udeck-music = "udeck.apps.main:music"
udeck-video = "udeck.apps.main:video"
udeck-browser = "udeck.apps.main:browser"
udeck-reader = "udeck.apps.main:reader"
udeck-games = "udeck.apps.main:games"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/udeck-terminal/color-schemes" = ["packaging/terminal.colorscheme", "packaging/terminal-dark.colorscheme"]

[tool.setuptools.package-data]
udeck = ["qml/*.qml", "locales/*.json", "fonts/*.ttf", "fonts/*.txt", "fonts/*.json", "fonts/*.md", "assets/input-prompts/*", "assets/interface-sounds/*", "assets/file-icons/*"]
"udeck.terminal" = ["qml/*.qml", "fonts/*.ttf", "fonts/*.txt", "fonts/*.json"]
"udeck.apps" = ["qml/*.qml", "navigation.js", "reader_web/*", "reader_web/foliate/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/udeck/backend.py" = ["F722", "F821"]
